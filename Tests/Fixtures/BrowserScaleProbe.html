<!doctype html><meta charset="utf-8"><title>QuadDesk Browser Test</title><style>body{font:24px system-ui;margin:36px;background:#eef6f6;color:#123}button,input{font:24px system-ui;padding:12px;margin:8px}header{background:white;padding:24px;border-radius:12px}p{padding:14px}</style><header><h1>QuadDesk Browser Test</h1><div id="viewport"></div><button id="counter" onclick="this.textContent='Clicks: '+(++window.n)">Clicks: 0</button><input aria-label="QuadDesk input" placeholder="Click here and type"><div id="typed">Input: empty</div></header><main id="lines"></main><script>window.n=0;document.querySelector('input').oninput=e=>document.querySelector('#typed').textContent='Input: '+e.target.value;document.querySelector('#viewport').textContent='Viewport: '+innerWidth+' × '+innerHeight;document.querySelector('#lines').innerHTML=Array.from({length:100},(_,i)=>'<p>Browser scroll line '+(i+1)+' — 日本語表示</p>').join('');</script><style>#input-trace{position:fixed;bottom:0;left:0;right:0;background:#fff4d5;color:#542b00;font:20px monospace;z-index:100;pointer-events:none;padding:10px;white-space:pre-wrap}</style><div id="input-trace">No events yet</div><script>let trace=[];for(const type of ['mousedown','mouseup','click'])document.addEventListener(type,e=>{trace.push(type+': client='+e.clientX+','+e.clientY+' screen='+e.screenX+','+e.screenY+' target='+e.target.tagName+'#'+e.target.id);trace=trace.slice(-3);document.querySelector('#input-trace').textContent=trace.join('\n')},true);function showSize(){const r=document.querySelector('#counter').getBoundingClientRect();document.querySelector('#viewport').textContent='Viewport: '+innerWidth+' × '+innerHeight+' | button center: '+Math.round(r.x+r.width/2)+','+Math.round(r.y+r.height/2)}window.addEventListener('resize',showSize);showSize();</script>
